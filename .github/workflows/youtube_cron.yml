name: Ultimate Autonomous YouTube Factory

on:
  schedule:
    - cron: '0 */6 * * *'  # Chạy tự động mỗi 6 tiếng
  workflow_dispatch:      # Cho phép bấm nút chạy thủ công

jobs:
  produce-and-evolve:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai google-auth google-auth-oauthlib google-auth-httplib2 requests

      - name: Run YouTube Automation Engine
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Thực thi script..."
          # python main.py
          
